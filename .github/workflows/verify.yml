name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            test/**/*.log
            coverage/
          retention-days: 7

  conformance:
    name: live conformance (three-node Riverbed)
    runs-on: ubuntu-latest
    # Only runs when the conformance Riverbed is provisioned via
    # repository variables; skips cleanly otherwise.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci && npm run build

      - name: Conformance suite (skipped without endpoints)
        run: npm run test:conformance
        env:
          WHITEWATER_ENDPOINTS: ${{ vars.WHITEWATER_ENDPOINTS }}
          WHITEWATER_SPEC_DIR: ${{ vars.WHITEWATER_SPEC_DIR }}
